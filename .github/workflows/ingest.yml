# Weekly editorial ingestion for Bias.
# Calls the FastAPI backend's RSS ingestion endpoint. The backend URL
# and the ingest key are GitHub Secrets — nothing secret is in this file.
name: Ingest editorial trends

on:
  schedule:
    # Sundays 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger RSS ingestion
        run: |
          curl -fsS -X POST "${{ secrets.BIAS_API_URL }}/api/ingest/rss" \
            -H "X-Ingest-Key: ${{ secrets.BIAS_INGEST_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
